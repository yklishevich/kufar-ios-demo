name = "spm-registry"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# Флаг нужен тестовому пулу: @cloudflare/vitest-pool-workers отказывается
# стартовать без nodejs_compat — ему самому требуются модули Node внутри
# рантайма, чтобы подменить R2 и D1.
#
# Флаг стоит здесь, а не только в vitest.config.ts, намеренно. Смысл этих
# тестов в том, что они идут в настоящем workerd с теми же настройками, что
# в проде; включи флаг только для тестов — и проверяться начнёт рантайм,
# которого в проде нет. Это ровно та щель, ради закрытия которой тесты
# и вынесены из ноды.
#
# Цена нулевая: с compatibility_date после 2024-09-23 это Node.js Compat v2,
# где полифилы попадают в бандл только при импорте из node:*. Наш код
# ничего оттуда не импортирует, значит и не добавляется ничего.
compatibility_flags = ["nodejs_compat"]

# Свой домен, а не workers.dev.
#
# Дело не в красоте: адрес реестра попадает в registries.json каждого
# потребителя и в Package.resolved каждой сборки. Переехать с него потом
# нельзя без правки у всех сразу — ровно та же жёсткость, что у гит-URL,
# от которой реестр и должен избавлять. Поддомен на своём домене
# переносится между провайдерами, spm-registry.workers.dev — нет.
#
# custom_domain = true просит Cloudflare завести DNS-запись и сертификат
# самостоятельно; зона byklishevich.com должна быть в этом же аккаунте.
routes = [
  { pattern = "spm-registry.byklishevich.com", custom_domain = true }
]

# Реестр пакетов Swift по SE-0292 на Cloudflare Workers.
#
# Разделение хранилищ намеренное:
#   R2 — архивы исходников. Блобы по несколько мегабайт, отдаются напрямую,
#        оплата за хранение и трафик, а не за операции.
#   D1 — метаданные релизов: версии, контрольные суммы, манифесты.
#        Нужен, потому что список релизов и разбор версий — это запросы,
#        а не выборка по ключу. Листинг бакета для этого не годится:
#        он не умеет сортировать по semver и не хранит checksum.
#
# Манифест лежит в D1, а не в R2, потому что он маленький и запрашивается
# при каждом резолве. Лишний round-trip в объектное хранилище тут дороже
# самой строки.

[[r2_buckets]]
binding = "ARCHIVES"
bucket_name = "spm-registry-archives"

[[d1_databases]]
binding = "DB"
database_name = "spm-registry"
database_id = "457f415b-8d44-47a4-9b5d-bde6b355b754"

[vars]
# Базовый URL реестра. Нужен, потому что в ответах спецификация требует
# абсолютные ссылки: список релизов отдаёт url каждой версии, а Link-заголовки
# указывают на latest-version и canonical.
#
# Задаётся явно, а не выводится из Request: Worker стоит за прокси Cloudflare,
# и Host в запросе не обязан совпадать с тем адресом, по которому клиент
# будет ходить дальше по выданным ссылкам.
REGISTRY_BASE_URL = "https://spm-registry.byklishevich.com"

# Секрет для публикации задаётся отдельно и в файл не попадает:
#   wrangler secret put PUBLISH_TOKEN
