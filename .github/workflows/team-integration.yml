name: Интеграция команды

# Тело интеграционной проверки. Живёт здесь в одном экземпляре, вызывается
# из репозиториев команд пятистрочным файлом.
#
# Собирает весь воркспейс с ревизией вызывающего PR на месте папки его
# команды. Проверяется не «компилируется ли пакет», а «переживут ли соседи
# мою правку»: пакет прекрасно собирается сам по себе и при этом роняет
# три чужих таргета, которые его импортируют.
#
# ── Почему проверка стоит у команды, а не только здесь ──────────────────
#
# Интеграцию ломает мерж в репозиторий команды. Проверка, стоящая в мета-
# репозитории, загорается после мержа, у другого владельца, и не отвечает
# на вопрос «чей PR виноват». Гейт должен стоять там, где принимается
# решение — тогда у него есть владелец и он не может быть красным «нормально».
#
# main любого пакета обязан оставаться релизопригодным. Ломающие изменения
# проводятся фазами (раздел 2.3 документа архитектуры): аддитивная правка
# с фолбэком у потребителей, затем переключение, затем удаление старого.
# Каждая фаза мержится отдельно и оставляет эту сборку зелёной. Красное
# здесь означает нарушение именно этого порядка.
#
# Сборка main всех команд разом осталась в workspace.yml и ловит то, чего
# гейт не видит принципиально: два PR, зелёные против main по отдельности,
# после приземления обоих дают красное.
#
# ── Про версию ─────────────────────────────────────────────────────────
#
# Команды подключаются по тегу (@v1), а не по @main: иначе правка здесь
# ломала бы CI шести команд одновременно и без предупреждения. Это ровно
# тот же довод, по которому пакеты подключаются через `from:`, а не веткой.
#
# По тому же тегу берётся и весь остальной воркспейс — Tools/bootstrap.sh,
# Tools/deplint.py. Первая версия клонировала мета-репозиторий дефолтной
# веткой, и закрепление выходило половинчатым: workflow приезжал старый,
# а скрипты, которые он запускает, — свежие с main. Сломанный bootstrap.sh
# положил бы CI шести команд немедленно, никакой тег этому не помешал бы.
#
# Репозитории команд при этом клонируются на своих main — это и есть предмет
# проверки: переживут ли соседи мою правку в их текущем состоянии.
#
# Тег v1 при этом ДВИГАЕТСЯ — в отличие от версий пакетов, которые
# неизменяемы. Разница не в непоследовательности: у пакетов есть
# Package.resolved, где версия закреплена по контрольной сумме, и подмена
# содержимого версии сломала бы это доверие. У workflow лок-файла нет
# вообще, поэтому подвижный мажорный тег — единственный способ доставить
# исправление, и так устроены все официальные actions.
#
#     git tag -f v1 && git push -f origin v1
#
# Двигать v1 можно только на совместимом изменении: поправлен шаг, добавлен
# необязательный input, сменён раннер. Несовместимое требует v2, и команды
# переходят сами, поменяв строку в своём integration.yml. Несовместимо:
# новый обязательный input без значения по умолчанию, переименование или
# удаление существующего, требование нового секрета.
#
# И отдельно — ПЕРЕИМЕНОВАНИЕ JOB'А. Оно выглядит косметикой, а ломает тише
# всего остального: в branch protection у команд required status checks
# заданы именами — «Граф зависимостей», «Сборка и тесты». Проверка с прежним
# именем перестанет приходить, и PR будет ждать статуса, которого больше
# никто не отправит. Не красное, а бесконечно ожидающее — и диагностируется
# это дольше любого падения. Переименовал job — это v2 плюс правка настроек
# ветки в шести репозиториях.

on:
  workflow_call:
    inputs:
      team:
        description: "Папка команды в воркспейсе, например search_team"
        required: true
        type: string

jobs:
  deplint:
    name: Граф зависимостей
    # ubuntu намеренно: линтер читает манифесты и не требует ни Xcode,
    # ни сети, ни тулчейна. Нарушение границы видно через минуту, а не
    # после сборки на macOS, которая тарифицируется с множителем 10.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Своя ревизия
        id: self
        # Тело workflow приезжает по тегу (@v1), а Tools/ лежат в том же
        # репозитории — значит и брать их надо тем же тегом, иначе закрепление
        # половинчатое: workflow старый, скрипты свежие с main.
        #
        # GITHUB_WORKFLOW_REF выглядит как
        #   owner/repo/.github/workflows/team-integration.yml@refs/tags/v1
        # то, что после последней @, и есть ревизия, которой нас вызвали.
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Клонировать воркспейс
        uses: actions/checkout@v4
        with:
          # repository_owner — владелец ВЫЗЫВАЮЩЕГО репозитория,
          # поэтому форк всего набора продолжает работать без правок.
          repository: ${{ github.repository_owner }}/kufar-ios-demo
          ref: ${{ steps.self.outputs.ref }}
          path: workspace

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Поднять репозитории команд
        working-directory: workspace
        env:
          KUFAR_ORG: https://github.com/${{ github.repository_owner }}
        run: ./Tools/bootstrap.sh

      - name: Подставить проверяемую ревизию
        working-directory: workspace/${{ inputs.team }}
        # Папка уже склонирована bootstrap'ом — переключаем её на нужный
        # коммит, а не клонируем поверх. Фетч по SHA работает и для PR
        # из форка: GitHub держит их головы в refs/pull/*.
        run: |
          git fetch --quiet origin ${{ github.event.pull_request.head.sha || github.sha }}
          git checkout --quiet FETCH_HEAD
          git --no-pager log -1 --oneline

      - name: Проверить направление зависимостей
        working-directory: workspace
        run: python3 Tools/deplint.py

  build:
    name: Сборка и тесты
    runs-on: macos-26
    # Xcode закреплён явно, а не взят дефолтом образа. Дефолт — движущаяся
    # цель: обновится образ, сменится тулчейн, и CI разойдётся с машинами
    # разработчиков без единого коммита. Тот же довод, по которому пакеты
    # подключаются через from:, а не веткой, а общий workflow — по тегу v1.
    #
    # 26.5 выбран под то, что стоит локально. На macos-26 рядом лежат
    # 26.6 (дефолт) и 26.4.1 — менять версию здесь, а не полагаться на образ.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      # Симулятор закреплён вместе с тулчейном и по той же причине. Имя
      # устройства — тоже движущаяся цель: на macos-26 линейки iPhone 16
      # уже нет, только 17-я. Версию рантайма фиксируем явно, чтобы
      # «свежий образ» не менял то, на чём гоняются тесты.
      #
      # Меняется в паре с DEVELOPER_DIR: 26.5 сверху — 26.5 здесь.
      SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.5
    timeout-minutes: 25
    steps:
      # Версия печатается намеренно: при расхождении с локальной машиной
      # первый вопрос — "чем собирали", и ответ должен быть в том же логе.
      - name: Тулчейн
        run: xcodebuild -version

      - name: Своя ревизия
        id: self
        # Тело workflow приезжает по тегу (@v1), а Tools/ лежат в том же
        # репозитории — значит и брать их надо тем же тегом, иначе закрепление
        # половинчатое: workflow старый, скрипты свежие с main.
        #
        # GITHUB_WORKFLOW_REF выглядит как
        #   owner/repo/.github/workflows/team-integration.yml@refs/tags/v1
        # то, что после последней @, и есть ревизия, которой нас вызвали.
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Клонировать воркспейс
        uses: actions/checkout@v4
        with:
          # repository_owner — владелец ВЫЗЫВАЮЩЕГО репозитория,
          # поэтому форк всего набора продолжает работать без правок.
          repository: ${{ github.repository_owner }}/kufar-ios-demo
          ref: ${{ steps.self.outputs.ref }}
          path: workspace

      - name: Поднять репозитории команд
        working-directory: workspace
        env:
          KUFAR_ORG: https://github.com/${{ github.repository_owner }}
        run: ./Tools/bootstrap.sh

      - name: Подставить проверяемую ревизию
        working-directory: workspace/${{ inputs.team }}
        run: |
          git fetch --quiet origin ${{ github.event.pull_request.head.sha || github.sha }}
          git checkout --quiet FETCH_HEAD
          git --no-pager log -1 --oneline

      - name: Показать, что подменено локально
        working-directory: workspace
        # Диагностика: в этом режиме ни одна зависимость не должна ехать
        # из сети. Строчка "Fetching https://…" в логе означает, что имя
        # папки разъехалось с идентичностью пакета — тогда Xcode не
        # подменяет, и проверяется опубликованная версия вместо ветки PR.
        run: ./Tools/bootstrap.sh --status

      - name: Тесты
        working-directory: workspace
        run: |
          xcodebuild test \
            -workspace KufarWorkspace.xcworkspace \
            -scheme KufarDemo \
            -destination "$SIMULATOR" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.team }}
          path: workspace/TestResults.xcresult

  notify:
    name: Сообщить мета-репозиторию
    # Только после мержа и только если сборка прошла: мета-репозиторий
    # соберёт main всех команд разом.
    needs: [deplint, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: repository_dispatch
        env:
          # Штатный GITHUB_TOKEN действует только в своём репозитории.
          # Для события в чужой нужен отдельный токен: fine-grained,
          # доступ только к kufar-ios-demo, право Contents: read and write.
          # Классический PAT со скоупом repo дал бы доступ ко всем
          # репозиториям владельца ради одного POST — несоразмерно.
          GH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Нет секрета WORKSPACE_DISPATCH_TOKEN — воркспейс не пересоберётся"
            exit 0
          fi
          gh api "repos/${{ github.repository_owner }}/kufar-ios-demo/dispatches" \
            -f event_type=team-repo-merged \
            -F "client_payload[repo]=${{ github.repository }}" \
            -F "client_payload[sha]=${{ github.sha }}"
