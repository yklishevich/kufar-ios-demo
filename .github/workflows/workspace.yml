name: Воркспейс — монорепо-режим

# Собирает всё против HEAD каждого репозитория, как на машине разработчика:
# соседние папки на месте, Xcode подменяет ими зависимости по identity,
# версии из манифестов не участвуют вообще.
#
# Ловит рассогласование НЕЗАРЕЛИЖЕННОЙ работы: правка в kufar.Foundation
# и её потребители должны быть согласованы прямо сейчас. Версионных проблем
# этот режим не видит принципиально — для них есть versioned.yml.
#
# ── Почему проверка не одна ─────────────────────────────────────────────
#
# Гейт стоит в репозиториях команд: на PR там собирается весь воркспейс
# с веткой этого PR на месте своей папки. Это правильное место для запрета —
# решение принимается на мерже, у проверки есть владелец, и она не может
# быть красной «нормально». Тело той проверки лежит рядом, в
# team-integration.yml, и вызывается оттуда через workflow_call.
#
# Здесь остаётся то, чего гейт не видит принципиально: два PR, зелёные
# против main каждый по отдельности, после приземления обоих дают красное.
# Семантический конфликт проявляется только вместе, и поймать его можно
# исключительно после мержа.
#
#   гейт на PR         моя ветка + main остальных     до мержа
#   эта сборка         main всех разом                после мержа
#
# repository_dispatch нужен потому, что мета-репозиторий сам по себе меняется
# редко: поломку приносит мерж в чужой репозиторий, и дёрнуть сборку должен он.
# Событие отправляет job `notify` из integration.yml команды.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [team-repo-merged]

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deplint:
    name: Граф зависимостей
    # Намеренно ubuntu: deplint читает манифесты и не требует ни Xcode,
    # ни сети, ни тулчейна. Отдельной job — чтобы нарушение границы
    # было видно через минуту, а не после двадцатиминутной сборки.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Клонировать репозитории команд
        env:
          KUFAR_ORG: https://github.com/${{ github.repository_owner }}
        run: ./Tools/bootstrap.sh

      - name: Проверить направление зависимостей
        run: python3 Tools/deplint.py

  build:
    name: Сборка и тесты
    runs-on: macos-26
    # Xcode закреплён явно, а не взят дефолтом образа. Дефолт — движущаяся
    # цель: обновится образ, сменится тулчейн, и CI разойдётся с машинами
    # разработчиков без единого коммита. Тот же довод, по которому пакеты
    # подключаются через from:, а не веткой, а общий workflow — по тегу v1.
    #
    # 26.5 выбран под то, что стоит локально. На macos-26 рядом лежат
    # 26.6 (дефолт) и 26.4.1 — менять версию здесь, а не полагаться на образ.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      # Симулятор закреплён вместе с тулчейном и по той же причине. Имя
      # устройства — тоже движущаяся цель: на macos-26 линейки iPhone 16
      # уже нет, только 17-я. Версию рантайма фиксируем явно, чтобы
      # «свежий образ» не менял то, на чём гоняются тесты.
      #
      # Меняется в паре с DEVELOPER_DIR: 26.5 сверху — 26.5 здесь.
      SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.5
    # Не needs: deplint — пусть оба результата приходят разом.
    # Линтер быстрее и обычно первым объясняет, почему упала сборка.
    #
    # Таймаут явный, потому что дефолт — шесть часов, а macOS-раннер тарифи-
    # цируется с десятикратным множителем. Job, зависший на команде, которая
    # ждёт ввода, съест месячную квоту и завершится словом «Cancelled»,
    # ничего не объяснив. Двадцать минут — с запасом на холодную сборку.
    timeout-minutes: 20
    steps:
      # Версия печатается намеренно: при расхождении с локальной машиной
      # первый вопрос — "чем собирали", и ответ должен быть в том же логе.
      - name: Тулчейн
        run: xcodebuild -version

      - uses: actions/checkout@v4

      - name: Клонировать репозитории команд
        env:
          KUFAR_ORG: https://github.com/${{ github.repository_owner }}
        run: ./Tools/bootstrap.sh

      - name: Показать, что подменено локально
        # Диагностика: в этом режиме ни одна зависимость не должна ехать из сети.
        # Строчка "Fetching https://github.com/..." в логе означает, что identity
        # пакета разъехалась с именем папки — то самое жёсткое правило из README.
        run: ./Tools/bootstrap.sh --status

      - name: Тесты
        run: |
          xcodebuild test \
            -workspace KufarWorkspace.xcworkspace \
            -scheme KufarDemo \
            -destination "$SIMULATOR" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
